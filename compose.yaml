services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copiar .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configurar POSTGRES_DB}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - mesati_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  mesati_pgdata:
